<form class="form" (ngSubmit)="submit()" (keydown.escape)="cancelled.emit()">
  <h3>Add Bill</h3>

  @if (error()) {
    <p class="error">{{ error() }}</p>
  }

  <label>Room
    <select #firstField name="roomId" [ngModel]="roomId()" (ngModelChange)="onRoomChanged($event)" (blur)="roomTouched.set(true)">
      <option [ngValue]="null">-- Choose a room --</option>
      @for (r of sortedRooms(); track r.id) {
        <option [ngValue]="r.id">Room {{ r.roomNo }}</option>
      }
    </select>
  </label>

  @if (roomError()) {
    <p class="error">{{ roomError() }}</p>
  }

  <label>Tenant
    <select name="tenantId" [(ngModel)]="tenantId" (blur)="tenantTouched.set(true)" [disabled]="roomId() === null">
      @if (roomId() === null) {
        <option [ngValue]="null">-- Choose a room first --</option>
      } @else if (roomTenants().length === 0) {
        <option [ngValue]="null">No tenants in this room</option>
      } @else {
        <option [ngValue]="null">-- Choose a tenant --</option>
        @for (t of roomTenants(); track t.id) {
          <option [ngValue]="t.id">{{ t.name }}</option>
        }
      }
    </select>
  </label>

  @if (tenantError()) {
    <p class="error">{{ tenantError() }}</p>
  }

  <label>Type
    <select name="type" [(ngModel)]="type">
      @for (t of types; track t) {
        <option [ngValue]="t">{{ t }}</option>
      }
    </select>
  </label>

  <div class="field">
    <span>Month</span>
    <app-month-picker [(value)]="month" />
  </div>

  <label>Amount (PHP)
    <input name="amount" type="number" min="0" [(ngModel)]="amount" (blur)="amountTouched.set(true)" />
  </label>

  @if (amountError()) {
    <p class="error">{{ amountError() }}</p>
  }

  <div class="field">
    <span>Due date</span>
    <app-date-picker [(value)]="dueDate" />
  </div>

  <label>Note (optional)
    <input name="note" [(ngModel)]="note" placeholder="Example: Meter 1200 to 1285" />
  </label>

  <div class="actions">
    <button type="submit" [disabled]="!canSave()">Save</button>
    <button type="button" (click)="cancelled.emit()">Cancel</button>
  </div>
</form>
