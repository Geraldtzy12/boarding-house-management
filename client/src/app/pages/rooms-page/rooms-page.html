<header class="bar">
  <h1>Boarding House</h1>
  <button (click)="onAddClick()">+ Add Room</button>
</header>

@if (error()) {
  <p class="error">{{ error() }}</p>
}

@if (showForm()) {
  <app-room-form [room]="editing()" (saved)="onSave($event)" (cancelled)="onCancel()" />
}

<div class="grid">
  @for (r of rooms(); track r.id) {
    <app-room-card [room]="r" (edit)="onEdit($event)" (remove)="onRemove($event)" />
  } @empty {
    <p>Wala pang rooms. I-click ang "+ Add Room".</p>
  }
</div>
