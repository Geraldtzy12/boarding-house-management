<div class="toolbar">
  <h2>Settings</h2>
</div>

<div class="card settings-card">
  <h3>Change password</h3>
  <p class="muted">Your new password takes effect right away. You stay logged in — use it the next time you log in.</p>

  @if (message()) {
    <p class="message">{{ message() }}</p>
  }
  @if (error()) {
    <p class="error">{{ error() }}</p>
  }

  <form (ngSubmit)="onChangePassword()">
    <label>Current password
      <input name="currentPassword" type="password" [(ngModel)]="currentPassword" autocomplete="current-password" />
    </label>
    <label>New password
      <input name="newPassword" type="password" [(ngModel)]="newPassword" autocomplete="new-password" />
    </label>
    <label>Confirm new password
      <input name="confirmPassword" type="password" [(ngModel)]="confirmPassword" autocomplete="new-password" />
    </label>
    <button type="submit" [disabled]="busy()">Change password</button>
  </form>
</div>
