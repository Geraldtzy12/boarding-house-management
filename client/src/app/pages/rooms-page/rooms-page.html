<div class="toolbar">
  <h2>Rooms</h2>
  <button (click)="onAddClick()">+ Add Room</button>
</div>

@if (error()) {
  <p class="error">{{ error() }}</p>
}

@if (showForm()) {
  <app-room-form [room]="editing()" [error]="error()" (saved)="onSave($event)" (cancelled)="onCancel()" />
}

<div class="grid">
  @for (r of rooms(); track r.id) {
    <app-room-card [room]="r" [tenantName]="tenantNameFor(r.id)" (edit)="onEdit($event)" (remove)="onRemove($event)" />
  } @empty {
    <p>No rooms yet. Click "+ Add Room".</p>
  }
</div>
