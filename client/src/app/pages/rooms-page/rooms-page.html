<div class="toolbar">
  <h2>Rooms</h2>
  <input type="search" placeholder="Search room, type, or tenant..." aria-label="Search rooms"
    (input)="onSearch($event)" />
  <button (click)="onAddClick()">+ Add Room</button>
</div>

@if (error() && !showForm()) {
  <p class="error">{{ error() }}</p>
}

@if (showForm()) {
  <app-room-form [room]="editing()" [error]="error()" (saved)="onSave($event)" (cancelled)="onCancel()" />
}

<div class="grid">
  @for (r of filteredRooms(); track r.id) {
    <app-room-card [room]="r" [tenantNames]="tenantNamesFor(r.id)" (edit)="onEdit($event)" (remove)="onRemove($event)" />
  } @empty {
    @if (search()) {
      <p>No rooms match "{{ search() }}".</p>
    } @else {
      <p>No rooms yet. Click "+ Add Room".</p>
    }
  }
</div>
