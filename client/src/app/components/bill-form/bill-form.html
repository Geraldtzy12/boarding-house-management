<form class="form" (ngSubmit)="submit()">
  <h3>Add Bill</h3>

  <label>Tenant
    <select name="tenantId" [(ngModel)]="tenantId">
      <option [ngValue]="null">-- Choose a tenants --</option>
      @for (t of tenants(); track t.id) {
        <option [ngValue]="t.id">{{ t.name }} (Room {{ t.room?.roomNo }})</option>
      }
    </select>
  </label>

  <label>Type
    <select name="type" [(ngModel)]="type">
      @for (t of types; track t) {
        <option [ngValue]="t">{{ t }}</option>
      }
    </select>
  </label>

  <div class="field">
    <span>Month</span>
    <app-month-picker [(value)]="month" />
  </div>

  <label>Amount (PHP)
    <input name="amount" type="number" min="0" [(ngModel)]="amount" />
  </label>

  <div class="field">
    <span>Due date</span>
    <app-date-picker [(value)]="dueDate" />
  </div>

  <label>Note (optional)
    <input name="note" [(ngModel)]="note" placeholder="Example: Meter 1200 to 1285" />
  </label>

  <div class="actions">
    <button type="submit" [disabled]="!canSave()">Save</button>
    <button type="button" (click)="cancelled.emit()">Cancel</button>
  </div>
</form>
